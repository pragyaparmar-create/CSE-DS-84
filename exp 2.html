<!doctype html>
<html>
    <head>
        <title>Experiment-2 Design a webpage using tables and include multimedia elements like audio, video, and iframe.</title>
    </head>
    <body>
        <h1>Experiment 2: Webpage with Tables and Multimedia</h1>
        <table border="4" align="center" height="500" width="400">
            <tr>
                <td>audio</td>
                <td><audio src="audio student.mp3" height="200" width="400" controls></audio></td>
            </tr>
            <tr>
                <td>video</td>
                <td><video src="215475.mp4" height="200" width="400" controls></video></td>
            </tr>
            <tr>
                <td>image</td>
                <td><iframe src="tulip.jpg" width="400" height="100"></iframe></td>
            </tr>
        </table>
    </body>
</html>
