<!DOCTYPE html>
<html>
<head>
    <title>Experiment 7 - Create a responsive webpage using CSS Media Queries</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: green;
            color: white;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
        }

        .box {
            background-color: lightgreen;
            padding: 30px;
            margin: 10px;
            width: 30%;
        }

        /* Tablet */
        @media screen and (max-width: 768px) {
            .container {
                flex-wrap: wrap;
            }

            .box {
                width: 40%;
            }
        }

        /* Mobile */
        @media screen and (max-width: 480px) {
            .container {
                flex-direction: column;
            }

            .box {
                width: auto;
            }

            header {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Webpage</h1>
        <p>Using CSS Media Queries</p>
    </header>

    <h2>My Webpage</h2>

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

</body>
</html>
