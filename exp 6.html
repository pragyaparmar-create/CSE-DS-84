<!DOCTYPE html>
<html>
<head>
    <title>Experiment 6 - Use CSS selectors (class, id, pseudo-classes) for styling</title>

    <style>
        .class-selector {
            color: green;
            font-weight: bold;
            font-size: 17px;
        }

        #id-selector {
            color: rgb(110, 31, 31);
            text-align: left;
            font-size: 17px;
        }

        .pseudo-class-selector {
            color: #2457a6;
            text-decoration: none;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSS Selectors</h1>
        <h3>1. Class Selector</h3>
        <p class="class-selector">This paragraph uses Class Selector.</p>
        <h3>2. ID Selector</h3>
        <h2 id="id-selector">This heading uses ID Selector.</h2>
        <h3>3. Pseudo-Class Selector</h3>
        <a href="exp 1.html" class="pseudo-class-selector">for experiment number 1 click here</a>
    </div>
</body>
</html>
