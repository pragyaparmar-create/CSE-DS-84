<!DOCTYPE html>
<html>
<head>
    <title>Experiment 5 - CSS Styling Methods</title>
    <style>
        h1 {
            color: darkblue;
            text-align: center;
        }

        p {
            font-size: 18px;
            color: black;
        }
    </style>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <h1>CSS Styling Methods</h1>

    <h2>Inline CSS</h2>
    <p style="color: red;">
        This paragraph is styled using Inline CSS.
    </p>

    <h2>Internal CSS</h2>
    <p>
        This paragraph is styled using Internal CSS.
    </p>

    <h2>External CSS</h2>
    <p class="external">
        This paragraph is styled using External CSS.
    </p>

</body>
</html>
